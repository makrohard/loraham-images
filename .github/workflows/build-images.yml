name: build-images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: which image(s) to build
        type: choice
        options: [lite, desktop, both]
        default: lite
  push:
    tags: ['v*']
  schedule:
    - cron: '0 4 1 * *'   # monthly refresh (see docs/maintenance.md; GitHub disables idle schedules ~60d)

permissions: {}

concurrency:
  group: build-images-${{ github.event.inputs.variant || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) v="${{ github.event.inputs.variant }}" ;;
            *) v="both" ;;
          esac
          case "$v" in
            lite)    echo 'matrix={"variant":["lite"]}' >> "$GITHUB_OUTPUT" ;;
            desktop) echo 'matrix={"variant":["desktop"]}' >> "$GITHUB_OUTPUT" ;;
            *)       echo 'matrix={"variant":["lite","desktop"]}' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: select
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Assert native arm64 runner
        run: |
          test "$(uname -m)" = aarch64 || { echo "not aarch64 — refuse to emulate"; exit 1; }

      - name: Free disk + install build deps
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            systemd-container xz-utils e2fsprogs parted zerofree curl ca-certificates \
            rsync fdisk util-linux dosfstools nftables iptables python3 jq
          df -h /

      - name: Build ${{ matrix.variant }}
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          sudo -E env WORK="$PWD/work" OUT="$PWD/out" WORKFLOW_RUN_ID="$WORKFLOW_RUN_ID" \
            bash builder/build.sh ${{ matrix.variant }}

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ matrix.variant }}
          path: out/logs-${{ matrix.variant }}/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image (on success)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-${{ matrix.variant }}
          path: |
            out/loraham-lhpc-${{ matrix.variant }}.img.xz
            out/loraham-lhpc-${{ matrix.variant }}.img.xz.sha256
            out/${{ matrix.variant }}.size
            out/logs-${{ matrix.variant }}/lhpc-image.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    # always() so a failed/oversized Desktop leg cannot block an independent Lite release
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: dl
      - name: Assemble + verify under cap
        run: |
          set -e
          mkdir -p rel
          for v in lite desktop; do
            img="dl/image-$v/loraham-lhpc-$v.img.xz"
            [ -f "$img" ] || { echo "no image for $v (skipped/failed) — independent publish"; continue; }
            sz=$(stat -c%s "$img")
            [ "$sz" -le 2147483648 ] || { echo "::error::$v asset $sz > 2GiB cap"; exit 1; }
            cp "dl/image-$v/"* rel/ 2>/dev/null || true
          done
          ( cd rel && sha256sum ./*.img.xz > SHA256SUMS || true )
          ls -l rel
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: rel/*
          fail_on_unmatched_files: false
