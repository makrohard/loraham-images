# The house-rules profile of this shell and Python repository, for LoRaHAM Pi Control's tools/check_houserules.py
# (`check_houserules.py <base>..<head>`, run in this repository). The checker reads it at <base>, so a range
# cannot relax its own rules. Attribution, markers and the HARD patterns are the checker's own and apply as
# in every repository.

# The tests: every script under tests/ is one layer; each `expect "..."`, `refute "..."` or `check "..."`
# call (shell) and each `check("...` call (Python) is one test.
layers = [["tests/", "images"]]
test_files = ["tests/*.sh", "tests/*.py"]
test_def = '^\s*(expect|refute|check)(\s+"|\(")'

# No module budgets: the budget table and the family directory belong to LoRaHAM Pi Control.
budget_file = ""
family_dir = ""

changelog = "CHANGELOG.md"

# In added test lines: a sleep that would decide an outcome (H3), and a network call.
[warn_patterns]
sleep = '(^|[;&|]\s*)sleep\s+[0-9]|time\.sleep\('
network = '\b(curl|wget)\b|urllib\.request|requests\.'
