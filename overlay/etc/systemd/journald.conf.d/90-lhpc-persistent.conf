# LoRaHAM image: keep the system journal across reboots, capped.
# Raspberry Pi OS's /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf keeps it in RAM
# only; this file sorts after it, so its settings win. `journalctl -b -1` shows the previous boot.
[Journal]
Storage=persistent
SystemMaxUse=128M
SystemMaxFileSize=16M
